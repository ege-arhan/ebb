[workspace]
resolver = "3"
members = ["crates/ebb-core", "crates/ebb-cli", "crates/ebb-mcp", "crates/ebb-ai", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ege-arhan/ebb"

[workspace.dependencies]
ebb-core = { path = "crates/ebb-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
jwalk = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"
trash = "5"
dirs = "6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
glob = "0.3"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
clap_complete = "4"
# Blocking HTTP, plain http only (local models): no TLS stack, no async runtime.
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

# macOS 27 dyld rejects proc-macro dylibs produced with the release settings above ("mis-aligned LINKEDIT").
# Build scripts and proc-macros run on the host only, so they get plain settings.
[profile.release.build-override]
opt-level = 0
codegen-units = 16
debug = false
strip = "none"

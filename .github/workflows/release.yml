name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macOS Intel, os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { name: Windows, os: windows-latest, args: "" }
          - { name: Linux, os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ebb ${{ github.ref_name }}"
          releaseBody: "Disk space, safe cleanups and AI storage. See the README for install notes (the apps are not code-signed yet)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  cli:
    name: cli (${{ matrix.target }})
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, ext: "" }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: "" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: ".exe" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p ebb-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/ebb${{ matrix.ext }} dist/
          cp LICENSE README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../ebb-cli-${{ github.ref_name }}-${{ matrix.target }}.zip .; else tar czf ../ebb-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .; fi
      - name: Upload to the release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.ref_name }}" ebb-cli-* --clobber

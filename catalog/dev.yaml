- id: npm-cache
  label: {en: npm cache, tr: npm önbelleği}
  category: dev
  safety: safe
  min_size_mb: 100
  paths:
    all: ["{home}/.npm/_cacache"]
    windows: ["{local}/npm-cache"]
- id: pnpm-store
  label: {en: pnpm store, tr: pnpm deposu}
  category: dev
  safety: review
  min_size_mb: 200
  note: {en: "Hard-linked into projects; pruning is safer than deleting.", tr: "Projelere hardlink'lidir; silmek yerine 'pnpm store prune' daha güvenli."}
  paths:
    macos: ["{home}/Library/pnpm/store"]
    windows: ["{local}/pnpm/store"]
    linux: ["{home}/.local/share/pnpm/store"]
- id: yarn-cache
  label: {en: Yarn cache, tr: Yarn önbelleği}
  category: dev
  safety: safe
  min_size_mb: 100
  paths:
    macos: ["{cache}/Yarn", "{home}/.yarn/berry/cache"]
    windows: ["{local}/Yarn/Cache"]
    linux: ["{cache}/yarn", "{home}/.yarn/berry/cache"]
- id: bun-cache
  label: {en: Bun install cache, tr: Bun önbelleği}
  category: dev
  safety: safe
  min_size_mb: 100
  paths:
    all: ["{home}/.bun/install/cache"]
- id: cargo-registry
  label: {en: Cargo registry cache, tr: Cargo kayıt önbelleği}
  category: dev
  safety: safe
  min_size_mb: 200
  paths:
    all: ["{home}/.cargo/registry/cache", "{home}/.cargo/registry/src", "{home}/.cargo/git/checkouts"]
- id: pip-cache
  label: {en: pip cache, tr: pip önbelleği}
  category: dev
  safety: safe
  min_size_mb: 100
  paths:

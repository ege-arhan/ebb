- id: docker-desktop-data
  label: {en: Docker Desktop VM disk, tr: Docker Desktop disk imajı}
  category: dev
  safety: never
  min_size_mb: 1000
  note: {en: "Use 'docker system prune' instead.", tr: "Bunun yerine 'docker system prune' kullan."}
  paths:
    macos: ["{home}/Library/Containers/com.docker.docker/Data"]
    windows: ["{local}/Docker"]
    linux: ["{home}/.docker/desktop"]
- id: xcode-archives
  label: {en: Xcode archives, tr: Xcode arşivleri}

- id: telegram-cache
  label: {en: Telegram media cache, tr: Telegram medya önbelleği}
  category: app
  safety: review
  min_size_mb: 200
  note: {en: "Media re-downloads from the cloud when you open a chat.", tr: "Medya, sohbeti açınca buluttan yeniden iner."}
  paths:
    macos: ["{home}/Library/Group Containers/*.ru.keepcoder.Telegram/stable/account-*/postbox/media"]
    windows: ["{data}/Telegram Desktop/tdata/user_data"]
    linux: ["{home}/.local/share/TelegramDesktop/tdata/user_data"]
- id: whatsapp-cache
  label: {en: WhatsApp media cache, tr: WhatsApp medya önbelleği}

- id: spotify-cache
  label: {en: Spotify offline cache, tr: Spotify çevrimdışı önbelleği}
  category: app
  safety: review
  note: {en: "Holds offline downloads; they re-download when needed.", tr: "Çevrimdışı indirmeleri tutar; gerektiğinde yeniden iner."}
  min_size_mb: 200
  paths:
    macos: ["{data}/Spotify/PersistentCache", "{cache}/com.spotify.client"]
    windows: ["{local}/Spotify/Storage", "{local}/Spotify/Data"]
    linux: ["{cache}/spotify/Storage", "{home}/.cache/spotify"]
- id: discord-cache
  label: {en: Discord cache, tr: Discord önbelleği}
  category: app
  safety: safe
  min_size_mb: 100
  paths:
    macos: ["{data}/discord/Cache", "{data}/discord/Code Cache", "{data}/discord/GPUCache"]
    windows: ["{data}/discord/Cache", "{data}/discord/Code Cache", "{data}/discord/GPUCache"]
    linux: ["{home}/.config/discord/Cache", "{home}/.config/discord/Code Cache", "{home}/.config/discord/GPUCache"]

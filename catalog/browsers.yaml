- id: chrome-cache
  label: {en: Chrome cache, tr: Chrome önbelleği}
  category: browser
  safety: safe
  min_size_mb: 50
  paths:
    macos: ["{cache}/Google/Chrome/*/Cache", "{cache}/Google/Chrome/*/Code Cache"]
    windows: ["{local}/Google/Chrome/User Data/*/Cache", "{local}/Google/Chrome/User Data/*/Code Cache"]
    linux: ["{cache}/google-chrome/*/Cache", "{cache}/google-chrome/*/Code Cache"]
- id: edge-cache
